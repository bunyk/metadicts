<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dictionaries</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #header {
      height: 40px;
      flex-shrink: 0;
      background: #eee;
      display: flex;
      align-items: center;
    }
    #search-input {
      padding: 6px;
      margin: 4px;
      border: 1px solid #d3d3d3;
      border-radius: 12px;
      width: 500px;
      font-size: 14px;
    }
    #main {
      display: flex;
      flex-direction: row;
      flex: 1;
      overflow: hidden;
    }
    #backlog-panel {
      width: 300px;
      overflow-y: scroll;
      border-right: 1px solid #eee;
    }
    #backlog-panel ul {
      margin: 0;
      padding: 8px 8px 8px 24px;
    }
    #backlog-panel li { margin: 2px 0; }
    #backlog-panel a, #config-link {  text-decoration: none; cursor: pointer; }
    #backlog-panel a:hover, #config-link:hover { text-decoration: underline; }
    #translations-panel {
      flex: 1;
      overflow-y: scroll;
      padding: 1em;
    }
    #dictcc-panel {
      flex: 1;
      overflow-y: auto;
    }
    #dictcc-panel iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #translations-table {
      border: 1px solid #d3d3d3;
      border-collapse: collapse;
    }
    #translations-table th,
    #translations-table td {
      border: 1px solid #d3d3d3;
      padding: 0.3em;
    }
    #loading-msg { font-size: 13px; color: #666; margin-top: 8px; }

    #config-page { display: none; padding: 12px; flex-direction: column; flex: 1; overflow: hidden; }
    #config-page textarea { margin: 12px 0; }
    #config-page h2 { margin: 8px 0 4px; }
  </style>
</head>
<body>

<div id="header">
  <input id="search-input" type="text" placeholder="Введіть слово для пошуку..." />
</div>

<div id="main">
  <div id="backlog-panel">
	  	<div>
			<button id="edit-link">Edit</button>
			<button id="linguisto" title="copy source">Linguisto</button>
		</div>
    <ul id="backlog-list"></ul>
  </div>
  <div id="translations-panel">
    <table id="translations-table">
      <thead>
        <tr><th>Deutsch</th><th>Українська</th><th>Джерело</th></tr>
      </thead>
      <tbody id="translations-body"></tbody>
    </table>
    <div id="loading-msg" style="display:none">Loading...</div>
  </div>
  <div id="dictcc-panel">
    <iframe id="dictcc-frame" src="about:blank"></iframe>
  </div>
</div>

<div id="config-page">
  <button id="config-back-link">Back to search</button>
  <h2>Backlog:</h2>
  <textarea id="config-textarea" rows="50" cols="150"></textarea>
  <h2>DeepL API:</h2>
  <div>
    <label for="deepl-key-input">Auth Key:</label>
    <input type="password" id="deepl-key-input" style="width: 300px; padding: 6px; margin: 4px;" />
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
